<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cores — Loki dashboard</title>
<link rel="stylesheet" href="/style.css">
<script src="/tz.js"></script>
</head>
<body>
<header>
  <span class="brand">LOKI</span>
  <nav>
    <a href="/" class="on">Cores</a>
    <a href="/shards">Shards</a>
    <a href="/matches">Matches</a>
    <a href="/game">Game</a>
    <a href="/lingo">Lingo</a>
    <a href="/replays">Replays</a>
  </nav>
  <span class="spacer"></span>
  <span class="clock" id="clock">…</span>
</header>

<main>
  <h1>What is running locally</h1>

  <div class="count" id="tznote">…</div>

  <div class="grid" id="cards"></div>

  <h2>Fleet</h2>
  <div class="count" id="fleetcount">…</div>
  <div id="fleet"></div>

  <h2>Shards running now</h2>
  <p style="margin-bottom:10px">
    <a class="cta" href="/shards">Open the full shard view &rarr;</a>
    <a class="cta" href="/matches" style="margin-left:8px">Match history &rarr;</a>
  </p>
  <div class="count" id="shardcount">…</div>
  <div class="scroll" id="shardwrap"><table id="shardtable">
    <thead><tr>
      <th>Shard</th><th>State</th><th class="mono">Progress</th>
      <th class="mono">Win rate</th><th class="mono">95% interval</th><th>Says</th>
    </tr></thead>
    <tbody></tbody>
  </table></div>

  <h2>Full shard table</h2>
  <div class="count" id="rawage">…</div>
  <pre class="raw" id="raw">loading…</pre>

  <footer>
    10s / 45s refresh. Serving from <span id="repo" class="mono"></span>.
  </footer>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s === null || s === undefined ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function freshBadge(ageMin, cadenceMin) {
  if (ageMin === null || ageMin === undefined) return '<span class="badge b-blind">NO STAMP</span>';
  const limit = (cadenceMin || 5) * 2;
  const cls = ageMin > limit ? 'b-warn' : 'b-ok';
  const label = ageMin > limit ? 'STALE' : 'fresh';
  return `<span class="badge ${cls}">${label} ${ageMin.toFixed(1)}m</span>`;
}

function card(k, v, sub) {
  return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>
          <div class="sub">${sub || ''}</div></div>`;
}

function render(s) {
  $('#clock').innerHTML = s.served_at ? tzTime(s.served_at) : '';
  $('#tznote').innerHTML = tzNote();
  $('#repo').textContent = s.repo;
  const c = [];

  // --- games running
  if (!s.procs.ok) {
    c.push(card('Local games', '<span class="badge b-blind">BLIND</span>', s.procs.blind));
  } else {
    const n = s.procs.games;
    const badge = n > 0 ? '<span class="badge b-ok">running</span>'
                        : '<span class="badge b-bad">IDLE</span>';
    c.push(card('Local games (fcode run)', n,
      `${badge} ${s.procs.corefill ? 'corefill up' : '<span class="badge b-warn">no corefill</span>'}`));
  }

  // --- load
  c.push(s.load.ok
    ? card('Load average', s.load.one, `${s.load.five} · ${s.load.fifteen} &nbsp;(5m · 15m)`)
    : card('Load average', '<span class="badge b-blind">BLIND</span>', s.load.blind));

  // --- idle alarm
  const ci = s.cores_idle;
  if (!ci.ok) {
    c.push(card('Idle alarm', '<span class="badge b-blind">BLIND</span>', ci.blind));
  } else {
    const v = ci.alerting ? '<span class="badge b-bad">CORES IDLE</span>'
                          : '<span class="badge b-ok">OK</span>';
    c.push(card('Idle alarm', v,
      `${freshBadge(ci.age_min, ci.cadence_min)} consec_idle=${ci.consec_idle ?? '?'}`
      + (ci.alert_file ? ' · ALERT file present' : '')));
  }

  // --- holder
  const h = s.holder;
  if (!h.ok) {
    c.push(card('Holder', '<span class="badge b-blind">BLIND</span>', h.blind));
  } else {
    c.push(card('Holder (local tape)', h.version,
      `rating ${h.rating} · ${h.matches} matches ${freshBadge(h.age_min, h.cadence_min)}`));
  }

  // --- shards
  const sh = s.shards;
  if (!sh.ok) {
    c.push(card('Shards', '<span class="badge b-blind">BLIND</span>', sh.blind));
  } else {
    const stalled = sh.n_stalled > 0
      ? ` <span class="badge b-warn">${sh.n_stalled} STALLED</span>` : '';
    c.push(card('Shards running', sh.n_running,
      `${sh.n_done} done · ${sh.n_total} total${stalled}`));
  }

  // --- monitors
  const p = s.procs;
  if (p.ok) {
    const down = Object.entries(p.monitors).filter(([, up]) => !up).map(([n]) => n);
    const v = down.length === 0 ? `${p.monitors_up}/${p.monitors_total}`
      : `<span class="badge b-warn">${p.monitors_up}/${p.monitors_total}</span>`;
    c.push(card('Monitors alive', v, down.length ? 'down: ' + down.join(', ') : 'all up'));
  }

  // --- queue (number comes from queue_check, the production admission gate)
  const q = s.queue;
  if (!q.ok) {
    c.push(card('Queue', '<span class="badge b-blind">BLIND</span>', q.blind));
  } else if (q.unblocked === null) {
    c.push(card('Queue unblocked', '<span class="badge b-blind">GATE UNREADABLE</span>',
      q.gate_unreadable || ''));
  } else {
    const low = q.unblocked <= q.floor;
    const v = low ? `<span class="badge b-bad">${q.unblocked}</span>` : q.unblocked;
    c.push(card('Queue unblocked', v,
      `floor ${q.floor} · file ${freshBadge(q.age_min, 240)}`));
  }

  $('#cards').innerHTML = c.join('');

  // --- running shard table
  const tb = $('#shardtable tbody');
  if (!sh.ok) {
    tb.innerHTML = '<tr><td colspan="6"><span class="badge b-blind">BLIND</span> ' + sh.blind + '</td></tr>';
    $('#shardcount').textContent = '';
  } else {
    const rows = [...sh.running, ...sh.stalled];
    $('#shardcount').textContent =
      `${sh.n_running} running · ${sh.n_stalled} stalled · ${sh.n_done} done · ${sh.n_total} shards seen`;
    const res = (s.shard_text && s.shard_text.rows) || {};
    tb.innerHTML = rows.length === 0
      ? '<tr><td colspan="6"><span class="badge b-bad">NOTHING RUNNING</span> <a href="/shards">All shards &rarr;</a></td></tr>'
      : rows.map(r => {
          const st = r.state === 'STALLED'
            ? '<span class="badge b-warn">STALLED</span>'
            : '<span class="badge b-ok">running</span>';
          const d = res[r.shard] || {};
          const n = d.n !== undefined && d.n !== null ? d.n : r.done;
          const pct = r.target && +r.target > 0
            ? `${Math.round(100 * r.done / r.target)}%` : '—';

          let rate = '—', interval = '—', says = '<span class="badge b-dim">no data yet</span>';
          if (d.refused) {
            rate = '<span class="badge b-dim" title="under 400 rows the 95% band is wider than any effect we chase">n&lt;400</span>';
            interval = '—';
            says = '<span class="badge b-dim">too few rows</span>';
          } else if (d.rate !== null && d.rate !== undefined) {
            const above = d.rate >= 50;
            rate = `<strong>${d.rate.toFixed(2)}%</strong>`;
            interval = (d.band !== null && d.band !== undefined)
              ? `${d.lo.toFixed(2)} – ${d.hi.toFixed(2)} &nbsp;<span style="color:var(--dimmer)">±${d.band.toFixed(2)}pp</span>`
              : '—';
            says = d.separated
              ? `<span class="badge ${above ? 'b-ok' : 'b-bad'}" title="the whole 95% interval sits off 50%">separated ${above ? 'ABOVE' : 'BELOW'} 50</span>`
              : '<span class="badge b-warn" title="not yet distinguishable from its control">inside band</span>';
          }
          return `<tr onclick="location.href='/shard?id=${encodeURIComponent(r.shard)}'" style="cursor:pointer">
                  <td class="mono"><a href="/shard?id=${encodeURIComponent(r.shard)}">${r.shard}</a></td><td>${st}</td>
                  <td class="mono">${n} / ${r.target} <span style="color:var(--dimmer)">${pct}</span></td>
                  <td class="mono">${rate}</td>
                  <td class="mono">${interval}</td>
                  <td>${says}</td></tr>`;
        }).join('');
  }

  // --- raw corefill_status text
  const rt = s.shard_text;
  if (rt.pending) {
    $('#rawage').innerHTML = '<span class="badge b-dim">first run pending</span> ' + rt.note;
    $('#raw').textContent = 'waiting for corefill_status.sh to complete its first run…';
  } else if (!rt.ok) {
    $('#rawage').innerHTML = '<span class="badge b-blind">BLIND</span> ' + (rt.error || '');
    $('#raw').textContent = rt.text || '(no output)';
  } else {
    $('#rawage').innerHTML = 'generated ' + tzTime(rt.at) + ' ' + freshBadge(rt.age_min, rt.cadence_min);
    $('#raw').textContent = rt.text || '(empty)';
  }
}

function fleetStateBadge(st) {
  const cls = {running:'b-ok', DONE:'b-ok', STALLED:'b-warn',
               DEAD:'b-bad', CANCELLED:'b-dim', queued:'b-dim'}[st] || 'b-dim';
  return `<span class="badge ${cls}">${esc(st)}</span>`;
}

// Non-fossil rows only (h.rows — this host's OWN generated worklist). h.prior
// (artefacts from earlier programmes, not in the current worklist) belongs to
// the full /shards fleet view, not this compact front-page summary.
function renderFleet(s) {
  const fleet = (s && s.remote_fleet) || {hosts: []};
  $('#fleetcount').textContent = fleet.hosts.length
    ? `${fleet.hosts.length} host(s)`
    : 'No fleet mirrors on disk.';
  $('#fleet').innerHTML = fleet.hosts.map(h => {
    const pullOld = h.pull && h.pull.age_min != null && h.pull.age_min > 12;
    const pull = !h.pull || h.pull.blind
      ? `<span class="badge b-blind">PULL BLIND</span>`
      : `<span class="badge ${pullOld ? 'b-warn' : 'b-ok'}">pull ${esc(h.pull.age_min)}m ago</span>`;
    const pending = h.pending_pull
      ? ` <span class="badge b-warn" title="worklist generated ${esc(h.worklist_generated)} is newer than the last successful pull">PENDING-PULL</span>` : '';
    const rows = (h.rows || []).map(r => {
      const tgt = r.target ? ` <span class="vs">/ ${esc(r.target)}</span>` : '';
      const hbAge = r.hb_age_min != null ? `hb ${esc(r.hb_age_min)}m` : 'no heartbeat';
      const share = (r.result && r.result.share != null)
        ? `<span class="mono">${esc(r.result.share)}%</span> <span class="vs">±${esc(((r.result.hi - r.result.lo) / 2).toFixed(2))}pp</span>`
        : '<span class="vs">—</span>';
      return `<tr onclick="location.href='/shard?id=${encodeURIComponent(r.shard)}'" style="cursor:pointer">
        <td class="mono"><a href="/shard?id=${encodeURIComponent(r.shard)}">${esc(r.shard)}</a></td>
        <td>${fleetStateBadge(r.state)}</td>
        <td class="mono">${r.rows != null ? esc(r.rows) : '—'}${tgt}</td>
        <td>${share}</td>
        <td class="mono">${hbAge}</td></tr>`;
    }).join('');
    return `<h3 class="mono" style="margin:14px 0 6px">${esc(h.host)} ${pull}${pending}
        <span class="count">· ${esc(h.n_running)} running · ${esc(h.n_queued)} queued</span></h3>
      <div class="scroll"><table><thead><tr>
        <th>Shard</th><th>State</th><th class="mono">n/target</th><th>Share</th><th class="mono">HB</th>
      </tr></thead><tbody>${rows || '<tr><td colspan="5">worklist unreadable</td></tr>'}</tbody></table></div>`;
  }).join('');
}

async function tick() {
  try {
    const r = await fetch('/api/status', {cache: 'no-store'});
    render(await r.json());
  } catch (e) {
    $('#clock').innerHTML = '<span class="badge b-blind">SERVER UNREACHABLE</span>';
  }
  try {
    const rf = await fetch('/api/shards', {cache: 'no-store'});
    renderFleet(await rf.json());
  } catch (e) {
    $('#fleetcount').innerHTML = '<span class="badge b-blind">SERVER UNREACHABLE</span>';
  }
}
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
