<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shard — Loki dashboard</title>
<link rel="stylesheet" href="/style.css">
<script src="/tz.js"></script>
</head>
<body>
<header>
  <span class="brand">LOKI</span>
  <nav>
    <a href="/">Cores</a>
    <a href="/shards" class="on">Shards</a>
    <a href="/matches">Matches</a>
    <a href="/game">Game</a>
    <a href="/lingo">Lingo</a>
  </nav>
  <span class="spacer"></span>
  <span class="clock" id="clock">…</span>
</header>

<main>
  <p class="lede" style="margin-bottom:6px"><a href="/shards">&larr; all shards</a></p>
  <h1 id="name" class="mono">…</h1>
  <div class="count" id="read">…</div>

  <!-- THE OPERATOR'S OWN WORDS COME FIRST. This block used to sit below the
       cards AND below a ten-line essay about the map rotation that is
       byte-identical on all 79 shard pages, so the one genuinely explanatory
       thing on the page was the last thing a reader reached. -->
  <div id="what"></div>

  <div class="grid" id="cards"></div>

  <div id="body"></div>

  <footer>
    <a href="/shards">&larr; all shards</a> · <a href="/">Cores overview</a> ·
    Auto-refreshes every 10 s. State, rows, percentage, heartbeat age, ETA, rate and
    band are read out of <code>tools/corefill_status.sh</code>; everything else on
    this page is a file on disk, shown with its own timestamp.
  </footer>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s === null || s === undefined ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ID = new URLSearchParams(location.search).get('id') || '';

// Authored descriptions (same file the list page uses). Loaded once; the page
// re-renders when it arrives so a slow fetch degrades to the worklist note,
// never to a blank.
let DESC = {}, LASTD = null;
fetch('/shard_descriptions.json', {cache: 'no-store'})
  .then(r => r.ok ? r.json() : {})
  .then(j => { DESC = j || {}; if (LASTD) render(LASTD); })
  .catch(() => {});

function freshBadge(ageMin, cadenceMin) {
  if (ageMin === null || ageMin === undefined) return '<span class="badge b-blind">NO STAMP</span>';
  const limit = (cadenceMin || 5) * 2;
  const cls = ageMin > limit ? 'b-warn' : 'b-ok';
  const label = ageMin > limit ? 'STALE' : 'fresh';
  return `<span class="badge ${cls}">${label} ${ageMin.toFixed(1)}m</span>`;
}

// PASSTHROUGH OF corpus/version_trees.tsv (same renderer as the list view). A
// tree the ledger does not name gets NO chip: the directory name is not a version
// (`_v197mapcode` is submission v125), so guessing one would be a fabrication.
function verChips(lab) {
  if (!lab) return '';
  let s = (lab.versions || []).map(v =>
    ` <span class="badge b-dim" title="corpus/version_trees.tsv — evidence: ${esc(v.evidence || 'none recorded')}">v${esc(v.version)}${v.name ? ' “' + esc(v.name) + '”' : ''}</span>`).join('');
  if (lab.incumbent)
    s += ` <span class="badge b-ok" title="this tree is PROGRAMME.md's INCUMBENT — the bot holding the live ladder slot">LIVE INCUMBENT</span>`;
  if (lab.ledger_blind)
    s += ` <span class="badge b-blind" title="${esc(lab.ledger_blind)}">LEDGER BLIND</span>`;
  return s;
}

// ⛔ A FILE ON DISK HAS NO CADENCE, SO IT CANNOT BE CALLED "fresh". The previous
// version passed a cadence of 1e9 to freshBadge for every artefact, which printed
// a green `fresh 2141.2m` beside a heartbeat last touched a day and a half ago.
// In a dashboard whose whole premise is that a healthy line and a blind line must
// not look alike, a green badge on a 35-hour-old file is the defect, not the fix.
// Artefacts get their age stated in human units and no verdict at all.
function fileAge(ageMin) {
  if (ageMin === null || ageMin === undefined) return '<span class="badge b-blind">NO STAMP</span>';
  const m = ageMin;
  const txt = m < 90 ? `${m.toFixed(1)} min ago`
            : m < 2880 ? `${(m / 60).toFixed(1)} h ago`
            : `${(m / 1440).toFixed(1)} days ago`;
  return `<span class="badge b-dim" title="age of the file itself; files have no refresh cadence, so this is not a fresh/stale verdict">${txt}</span>`;
}

function stateBadge(st) {
  const cls = {running:'b-ok', DONE:'b-ok', STALLED:'b-warn', DEAD:'b-bad',
               CANCELLED:'b-dim', queued:'b-dim'}[st] || 'b-dim';
  return `<span class="badge ${cls}">${esc(st)}</span>`;
}

const STATE_MEANS = {
  running:   'an `overnight.sh` process is alive and its heartbeat is moving',
  STALLED:   'alive but frozen — the process exists, the heartbeat has not moved for over 600 s',
  DEAD:      'started, no process. corefill deliberately never relaunches, so it stays dead until a human looks',
  DONE:      'its .COMPLETE marker exists — it reached its pre-registered target',
  CANCELLED: 'cut short by hand. Rows are KEPT, so the rate below is whatever its partial rows give — read the progress beside it',
  queued:    'a worklist line that has never been launched',
};

function card(k, v, sub) {
  return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>
          <div class="sub">${sub || ''}</div></div>`;
}

function mapBadge(label) {
  if (label === 'live pool') return '<span class="badge b-ok">live pool</span>';
  if (label === 'MIXED') return '<span class="badge b-bad">MIXED</span>';
  if (label === 'unknown') return '<span class="badge b-blind">unknown</span>';
  return '<span class="badge b-warn">RETIRED GEOMETRY</span>';
}

function fileBlock(title, f, extra) {
  if (!f || !f.exists) {
    return `<h3>${title}</h3><p class="lede"><span class="badge b-dim">absent</span>
            <code>${esc((f && f.path) || '')}</code> does not exist.</p>`;
  }
  return `<h3>${title}</h3>
    <div class="count"><code>${esc(f.path)}</code> · ${esc(f.bytes)} bytes ·
      written ${tzTime(f.at)} ${fileAge(f.age_min)}</div>
    ${extra || ''}`;
}

function render(d) {
  LASTD = d;
  document.title = d.shard + ' — Loki dashboard';
  $('#name').textContent = d.shard;
  $('#clock').innerHTML = d.served_at ? tzTime(d.served_at) : '';

  if (!d.exists) {
    $('#what').innerHTML = '';
    $('#cards').innerHTML = '';
    $('#read').innerHTML = tzNote() + '<br>read ' + tzTime(d.served_at);
    $('#body').innerHTML = `<div class="note warn"><strong>No such shard.</strong>
      Nothing on disk and no worklist line for <code>${esc(d.shard)}</code>.
      <a href="/shards">Back to the shard list.</a></div>`;
    return;
  }

  // ---------- the two clocks, said out loud -------------------------------
  $('#read').innerHTML =
    tzNote() + '<br>'
    + 'page data read <strong>' + tzTime(d.served_at) + '</strong> · state/rows/rate from '
    + '<code>' + esc(d.status_source) + '</code> captured '
    + (d.status_at ? tzTime(d.status_at) + ' ' + freshBadge(d.status_age_min, d.status_cadence_min)
                   : '<span class="badge b-blind">never — no capture yet</span>')
    + ' · auto-refreshing every 10 s';

  // ---------- what this shard tests ----------------------------------------
  // Two layers, clearly separated: (1) the AUTHORED description (curated in
  // tools/dash/static/shard_descriptions.json — the brief line is the same one
  // the list page shows, the full text expands it); (2) the operator's verbatim
  // worklist note, kept untouched below because nothing on this page is allowed
  // to silently paraphrase the primary.
  const w = d.worklist;
  const block = (w && w.comment_block) || [];
  const prose = block.map(l => l.replace(/^#\s?/, '')).join('\n').trim();
  const wparts = [];
  const dd = DESC[d.shard];
  if (dd && dd.brief) {
    wparts.push(`<p class="headline">${esc(dd.brief)}</p>`);
    if (dd.full) {
      wparts.push(`<p class="lede" style="margin:0 0 10px; white-space:pre-line">${esc(dd.full)}</p>`);
    }
    wparts.push(`<p class="lede" style="font-size:11.5px;margin:0 0 10px;opacity:.75">Authored description
      (<code>shard_descriptions.json</code>) — the operator's own worklist note is below, verbatim.</p>`);
  } else if (d.note) {
    wparts.push(`<p class="headline"><span class="badge b-dim" title="no authored description yet — this is the raw worklist note">worklist note</span> ${esc(d.note.text)}</p>`);
    if (!d.note.shard_named) {
      wparts.push(`<p class="lede" style="margin:0 0 10px"><span class="badge b-dim">batch note</span>
        This line does not name <code>${esc(d.shard)}</code>: worklist comment blocks sit
        above a <em>group</em> of shard lines, so it describes the batch this shard
        belongs to. The whole block is below, verbatim.</p>`);
    }
  }
  if (w) {
    // ⭐ WHAT THIS SHARD RUNS AGAINST, said in one line before the table. The
    // worklist names two directories; the ledger (corpus/version_trees.tsv) says
    // which of them we actually SUBMITTED, and PROGRAMME.md says which one holds
    // the live slot. Passthrough of both — a tree in neither renders bare.
    if (d.treatment_ver || d.control_ver) {
      wparts.push(`<p class="sub-mono" style="margin:0 0 10px;font-size:12.5px">
        <span class="vs">arm</span> ${esc(w.treatment)}${verChips(d.treatment_ver)}
        &nbsp;<span class="vs">vs</span>&nbsp; ${esc(w.control)}${verChips(d.control_ver)}</p>`);
    }
    wparts.push(`<table class="kv">
      <tr><td>treatment (the arm)</td><td class="mono">${esc(w.treatment) || '<span class="badge b-dim">—</span>'}${verChips(d.treatment_ver)}</td></tr>
      <tr><td>control</td><td class="mono">${esc(w.control) || '<span class="badge b-dim">—</span>'}${verChips(d.control_ver)}</td></tr>
      <tr><td>target games</td><td class="mono">${esc(w.target) || '<span class="badge b-dim">—</span>'}</td></tr>
      <tr><td>seed block</td><td class="mono">${esc(w.seed_lo) || '<span class="badge b-dim">—</span>'}</td></tr>
    </table>
    <p class="lede" style="font-size:13px;margin:10px 0 0">The percentage on this page
      is the share of finished games won by the <strong>treatment</strong> tree against
      that control — 50% is the no-difference point.</p>`);
  }
  if (prose) {
    wparts.push(`<h3>The worklist note in full (verbatim, ${esc(block.length)} line${block.length === 1 ? '' : 's'})</h3>
      <pre class="prose">${esc(prose)}</pre>
      <p class="lede" style="font-size:12px;margin:6px 0 0">Copied from
        <code>${esc(d.worklist_path)}</code>, the comment block immediately above line
        ${esc(w.lineno)}. Nothing on this page paraphrases it.</p>`);
  }
  $('#what').innerHTML = wparts.length
    ? `<div class="what"><div class="k">What this shard tests</div>${wparts.join('')}</div>`
    : `<div class="note warn"><strong>No worklist line, so nothing states what this
        shard tests.</strong> Its line was replaced by a later batch; the artefacts
        below are all that can honestly be shown.</div>`;

  // ---------- cards: the authority's own fields, nothing recomputed ----------
  const st = d.status;
  const c = [];
  if (d.status_pending) {
    c.push(card('State', '<span class="badge b-dim">pending</span>',
                'corefill_status.sh has not completed its first run'));
  } else if (!st) {
    c.push(card('State', '<span class="badge b-blind">NOT REPORTED</span>',
                d.in_worklist ? 'in the worklist but absent from the tool output'
                              : 'no worklist line — the status tool does not cover it'));
  } else {
    c.push(card('State', stateBadge(st.state), esc(STATE_MEANS[st.state] || '')));
    c.push(card('Progress', `${esc(st.pct)}`,
                `${esc(st.rows)} rows${d.worklist && d.worklist.target ? ' of ' + esc(d.worklist.target) : ''}`
                + (st.eta && st.eta !== '-' ? ` · ETA ${esc(st.eta)}` : '')));
    let rateV, rateS;
    if (st.refused) {
      rateV = '<span class="badge b-dim">NO RATE</span>';
      rateS = esc(st.result_raw);
    } else if (st.rate !== null && st.rate !== undefined) {
      rateV = st.rate.toFixed(2) + '%';
      rateS = (st.band !== null && st.band !== undefined
               ? `${st.lo.toFixed(2)} – ${st.hi.toFixed(2)} (±${st.band.toFixed(2)}pp, n=${esc(st.n)})` : '')
              + ' ' + (st.separated
                ? `<span class="badge ${st.rate >= 50 ? 'b-ok' : 'b-bad'}">separated ${st.rate >= 50 ? 'ABOVE' : 'BELOW'} 50</span>`
                : '<span class="badge b-warn">inside band</span>');
    } else {
      rateV = '<span class="badge b-dim">—</span>';
      rateS = esc(st.result_raw) || 'the tool printed no result for this shard';
    }
    c.push(card('Treatment win share', rateV, rateS));
    // ⛔ `-` and `-5s` ARE DIFFERENT FACTS. corefill_status.sh prints a bare `-`
    // when the shard has NO heartbeat file at all, and a negative number only
    // when one was written during its own ~5 s scan loop. Testing /^-/ matched
    // both, so four shards with no heartbeat were shown a warning badge and a
    // paragraph blaming a tool defect that was not happening. An alarm that
    // fires on the wrong condition is worse than no alarm.
    const neg = /^-\d/.test(st.hb_age);
    const none = st.hb_age === '-';
    c.push(card('Heartbeat age', none ? '<span class="badge b-dim">none</span>' : esc(st.hb_age),
      none ? 'no <code>.heartbeat</code> file exists for this shard — it never wrote one'
      : neg ? '<span class="badge b-warn">NEGATIVE</span> corefill_status.sh captures NOW once, before its ~5 s loop; a heartbeat written during the loop reads as negative. Defect is in the tool, reported not patched.'
            : 'as printed by corefill_status.sh'));
  }
  const m = d.maps;
  c.push(card('Map set', mapBadge(m.label),
    `${esc(m.n_maps)} distinct maps · decided from ${esc(m.source || 'nothing')}`));
  $('#cards').innerHTML = c.join('');

  // ---------- body ----------
  const b = [];

  // map set — a real analysis hazard, so the VERDICT stays open; the standing
  // explanation of the rotation is identical on every shard page and is folded.
  const pre = m.label !== 'live pool';
  b.push(`<h2>Map set</h2>
    <div class="note ${pre ? 'warn' : ''}">
      <strong>${mapBadge(m.label)} ${esc(m.label)}</strong><br>
      ${esc(m.why)}<br>
      <span class="mono" style="font-size:12px">maps: ${m.maps.length ? esc(m.maps.join(' ')) : '(none)'}</span>
    </div>
    <details><summary>Why the map set matters (same on every shard)</summary>
    <p class="lede">The organisers rotated the map pool on 2026-08-13;
      <code>tools/overnight.sh</code> was re-pointed at the live 15-map pool in
      <code>${esc(m.rotation_commit)}</code> at ${tzTime(m.rotation_at)}.
      Four maps of the previous eight — <code>atoll heart hive meander</code> — are
      no longer in the pool, so <strong>half of every pre-rotation shard is played on
      geometry that no longer exists</strong> and the two populations must not be
      pooled. The label above is read from this shard's own <code>map</code> column
      where its rows decide it, and only falls back to launch time when they do not —
      which it says when it does.</p></details>`);

  // what defines it
  if (d.worklist) {
    b.push(`<h2>Worklist line</h2>
      <div class="count">${esc(d.worklist_path)} line ${esc(d.worklist.lineno)}</div>
      <pre class="raw">${esc(d.worklist.line)}</pre>`);
  } else {
    b.push(`<h2>Worklist line</h2>
      <div class="note warn"><strong>No line in
        <code>${esc(d.worklist_path)}</code>.</strong> Its line was replaced by a
        later batch. <code>corefill_status.sh</code> iterates the worklist, so the
        authority reports nothing for this shard — and neither does this page:
        no state, no rows, no rate. The artefacts below are all that can honestly
        be shown.</div>`);
  }

  b.push('<h2>Artefacts on disk</h2>');

  b.push(fileBlock('Heartbeat', d.heartbeat,
    d.heartbeat.line ? `<pre class="raw">${esc(d.heartbeat.line)}</pre>
      <p class="lede" style="font-size:13px">Written by <code>tools/overnight.sh</code> as
      <code>ts&nbsp;games_done&nbsp;TARGET_N&nbsp;shard&nbsp;STATE</code>. Shown verbatim; the
      row count this page reports comes from the status tool, not from this line.</p>` : ''));

  b.push(fileBlock('Started marker', d.started_marker,
    d.started_marker.text ? `<pre class="raw">${esc(d.started_marker.text)}</pre>` : ''));
  if (!d.started_marker.exists) {
    b.push(`<p class="lede" style="margin-top:-10px">No marker means
      <code>corefill.sh</code> never launched it — markers are written
      <em>before</em> the launch and never removed.</p>`);
  }

  b.push(fileBlock('Completion marker', d.complete_marker,
    d.complete_marker.line ? `<pre class="raw">${esc(d.complete_marker.line)}</pre>` : ''));

  b.push(fileBlock('Rows file', d.tsv));

  b.push(fileBlock('launch.log (last 40 lines)', d.launch_log,
    `<pre class="raw">${d.launch_log.tail && d.launch_log.tail.length
       ? esc(d.launch_log.tail.join('\n'))
       : '(empty — overnight.sh writes here only on RESUMING, ABORT or COMPLETE)'}</pre>`));

  $('#body').innerHTML = b.join('');
}

async function tick() {
  if (!ID) {
    $('#body').innerHTML = '<div class="note warn">No <code>?id=</code> in the URL. <a href="/shards">Pick a shard.</a></div>';
    return;
  }
  try {
    const r = await fetch('/api/shard?id=' + encodeURIComponent(ID), {cache: 'no-store'});
    const d = await r.json();
    if (d.error) {
      $('#name').textContent = ID;
      $('#body').innerHTML = `<div class="note warn"><strong>${esc(d.error)}</strong>
        — <code>${esc(ID)}</code> is not a shard id this server will look up.
        <a href="/shards">Back to the shard list.</a></div>`;
      return;
    }
    render(d);
  } catch (e) {
    $('#clock').innerHTML = '<span class="badge b-blind">SERVER UNREACHABLE</span>';
    $('#read').innerHTML = '<span class="badge b-blind">SERVER UNREACHABLE</span> '
      + 'anything below is whatever was last read and is NOT being refreshed.';
  }
}
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
